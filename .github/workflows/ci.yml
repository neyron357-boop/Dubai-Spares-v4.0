name: Quality checks

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types, correctness lint, unit tests and production build
        run: npm run check
      - name: Dependency audits
        run: |
          npm audit --audit-level=low
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser workflows with isolated data
        run: npm run test:e2e
      - name: Production offline workflows
        run: npm run test:e2e:offline
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 7
