name: Quality checks

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types, correctness lint, unit tests and production build
        run: npm run check
      - name: Dependency audits
        # Shipped dependencies must be clean. Build-only tooling never reaches
        # visitors, so only a high-severity advisory there blocks deployment.
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser workflows with isolated data
        run: npm run test:e2e
      - name: Production offline workflows
        run: npm run test:e2e:offline
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 7
