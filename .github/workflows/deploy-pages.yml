name: Deploy application to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Configure public Supabase build values
        env:
          REQUIRE_STAFF_AUTH: ${{ vars.REQUIRE_STAFF_AUTH }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const allowed = new Set(['VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY']);
          const lines = readFileSync('.env.example', 'utf8').split(/\r?\n/)
            .filter((line) => allowed.has(line.split('=', 1)[0]));
          if (lines.length !== allowed.size) throw new Error('Missing public Supabase build configuration');
          const requireAuth = process.env.REQUIRE_STAFF_AUTH === 'true';
          writeFileSync('.env.production', lines.join('\n') + `\nVITE_REQUIRE_AUTH=${requireAuth}\n`);
          NODE
      - name: Build application
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="${PAGES_BASE_PATH}/"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
