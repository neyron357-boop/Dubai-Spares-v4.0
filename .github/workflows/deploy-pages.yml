name: Deploy application to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build application
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="${PAGES_BASE_PATH}/"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify published application
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
      PAGES_BASE_PATH: ${{ needs.build.outputs.base_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install verification dependencies
        run: npm ci
      - name: Build expected published assets
        run: npm run build -- --base="${PAGES_BASE_PATH}/"
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check published assets, mobile layout and offline navigation
        run: node scripts/verify-deployed.mjs
      - name: Save published screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-application-screenshots
          path: deploy-smoke/
          retention-days: 7
